[project]
name = "apollo-wheels-mvp"
version = "0.1.0"
description = "Internal contract-to-pricing and billing audit MVP for Apollo Wheels"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.13,<2.14",
    "pyjwt>=2.10,<3",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
