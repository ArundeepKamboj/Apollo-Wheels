<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Apollo Wheels local MVP architecture</title><desc id="desc">Three human demo users authenticate with a separate OAuth2 Auth service. Browser business calls use one API Gateway, which routes bearer-token requests to Contract, Pricing, or Billing. Pricing and Billing services use scoped client-credentials tokens for REST calls. Data is in shared local SQLite and PDFs in local files, with separate service audit databases. Future includes corporate OIDC, MFA, load balancing, backend authorization, and four-eyes identity separation.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#52647a"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17304b}.h{font-size:26px;font-weight:bold}.sub{font-size:14px;fill:#52647a}.title{font-size:16px;font-weight:bold}.body{font-size:13px}.small{font-size:12px}.box{fill:white;stroke:#91a3ba;stroke-width:1.5;rx:12}.blue{fill:#eaf3ff;stroke:#5590cf}.green{fill:#e8f7f0;stroke:#4eaa7b}.purple{fill:#f2edff;stroke:#8b75c9}.gold{fill:#fff5df;stroke:#c99a37}.future{fill:#f7f5ff;stroke:#8b75c9;stroke-dasharray:6 4}.arr{fill:none;stroke:#52647a;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1200" height="700" fill="#f6f8fb"/><text x="40" y="48" class="h">Apollo Wheels | Local MVP architecture</text><text x="40" y="74" class="sub">Authenticated browser ingress, independently runnable APIs, shared MVP business data, service-specific audit trails</text>
<rect x="30" y="100" width="1140" height="370" fill="#fff" stroke="#d3dce8" rx="18"/><text x="55" y="132" class="title">Local demonstration topology</text>
<rect x="55" y="180" width="155" height="72" class="box gold"/><text x="132" y="208" text-anchor="middle" class="title">Internal users</text><text x="132" y="232" text-anchor="middle" class="body">Finance · Structuring</text>
<rect x="270" y="180" width="170" height="72" class="box blue"/><text x="355" y="208" text-anchor="middle" class="title">Browser UI</text><text x="355" y="232" text-anchor="middle" class="body">One frontend origin</text>
<path d="M210 216H266" class="arr"/><text x="238" y="205" text-anchor="middle" class="small">login</text>
<rect x="505" y="155" width="190" height="88" class="box blue"/><text x="600" y="184" text-anchor="middle" class="title">API Gateway</text><text x="600" y="207" text-anchor="middle" class="body">JWT check · route · request ID</text><text x="600" y="228" text-anchor="middle" class="small">Single browser API endpoint</text>
<path d="M440 216H500" class="arr"/><text x="470" y="204" text-anchor="middle" class="small">Bearer JWT</text>
<rect x="505" y="300" width="190" height="76" class="box gold"/><text x="600" y="329" text-anchor="middle" class="title">Auth service</text><text x="600" y="352" text-anchor="middle" class="body">OAuth2 token issuer · PBKDF2</text>
<path d="M505 338C465 338 465 240 440 240" class="arr"/><text x="462" y="310" class="small">signed JWT</text>
<rect x="760" y="120" width="190" height="82" class="box green"/><text x="855" y="149" text-anchor="middle" class="title">Contract API</text><text x="855" y="172" text-anchor="middle" class="body">Upload · extract · review</text><text x="855" y="191" text-anchor="middle" class="small">Structuring owns edits</text>
<rect x="760" y="235" width="190" height="82" class="box green"/><text x="855" y="264" text-anchor="middle" class="title">Pricing API</text><text x="855" y="287" text-anchor="middle" class="body">Finance pricing versions</text><text x="855" y="306" text-anchor="middle" class="small">Four-eyes activation</text>
<rect x="760" y="350" width="190" height="82" class="box green"/><text x="855" y="379" text-anchor="middle" class="title">Billing &amp; Audit API</text><text x="855" y="402" text-anchor="middle" class="body">PDF ingest · reconciliation</text><text x="855" y="421" text-anchor="middle" class="small">History by client/service</text>
<path d="M695 188H755" class="arr"/><path d="M695 199C730 199 725 276 755 276" class="arr"/><path d="M695 210C730 210 725 391 755 391" class="arr"/><text x="721" y="177" class="small">REST</text>
<rect x="1000" y="190" width="145" height="82" class="box purple"/><text x="1072" y="220" text-anchor="middle" class="title">Shared SQLite</text><text x="1072" y="244" text-anchor="middle" class="body">MVP business records</text>
<rect x="1000" y="315" width="145" height="66" class="box purple"/><text x="1072" y="344" text-anchor="middle" class="title">Local PDF files</text><text x="1072" y="366" text-anchor="middle" class="body">Contracts · invoices</text>
<path d="M950 160C980 160 970 215 995 215" class="arr"/><path d="M950 276H995" class="arr"/><path d="M950 390C980 390 970 255 995 255" class="arr"/><path d="M950 176C980 176 975 335 995 335" class="arr"/><path d="M950 404H995" class="arr"/>
<text x="1000" y="423" class="small">Audit trail: data/audit/{auth,contract,pricing,billing,gateway}.sqlite</text>
<rect x="30" y="495" width="1140" height="175" fill="#fff" stroke="#c8bde8" stroke-dasharray="7 5" rx="18"/><text x="55" y="529" class="title">Future shared/production deployment</text>
<rect x="60" y="552" width="270" height="75" class="box future"/><text x="195" y="581" text-anchor="middle" class="title">Corporate Identity Provider</text><text x="195" y="605" text-anchor="middle" class="body">OIDC · MFA · managed roles</text>
<rect x="415" y="552" width="330" height="75" class="box future"/><text x="580" y="581" text-anchor="middle" class="title">Load balancer + API Gateway</text><text x="580" y="605" text-anchor="middle" class="body">JWT validation · routing · policy</text>
<rect x="830" y="552" width="310" height="75" class="box future"/><text x="985" y="579" text-anchor="middle" class="title">Backend authorization + four-eyes</text><text x="985" y="603" text-anchor="middle" class="body">Immutable user IDs · initiator cannot approve</text>
<path d="M330 590H410" class="arr"/><path d="M745 590H825" class="arr"/><text x="60" y="650" class="small">No CDN planned: this internal MVP is API/data heavy and serves little cacheable public content.</text>
</svg>
